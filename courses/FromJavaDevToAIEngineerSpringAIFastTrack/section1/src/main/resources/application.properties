spring.application.name=gemini-ai

spring.ai.chat.client.enabled=false
spring.ai.google.genai.api-key=${GEMINI_AI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.ollama.chat.options.model=llama3.2

logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n